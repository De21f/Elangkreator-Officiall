<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELANGKREATOR V7 — Admin</title><link rel="stylesheet" href="assets/css/style.css"></head><body><main class="admin-main"><div class="container"><a href="index.html">← Kembali ke website</a><div id="loginPanel" class="admin-box" style="max-width:480px;margin:40px auto"><p class="eyebrow">ADMIN V7</p><h1>Dashboard</h1><form id="loginForm" class="form"><input id="email" type="email" required placeholder="Email admin"><input id="password" type="password" required placeholder="Password"><button class="btn">Masuk</button><small id="loginStatus" class="status"></small></form></div><div id="dashboard" hidden><div class="row"><div><p class="eyebrow">BUSINESS CONTROL CENTER</p><h1>ELANGKREATOR</h1></div><button id="logout" class="btn outline">Keluar</button></div><div id="metrics" class="admin-grid"></div><div class="admin-box"><h2>Tambah Produk</h2><form id="productForm" class="form"><input name="name" required placeholder="Nama produk"><input name="category" required placeholder="Kategori"><input name="price" required type="number" min="0" placeholder="Harga"><textarea name="description" required placeholder="Deskripsi"></textarea><button class="btn">Simpan Produk</button><small id="productStatus" class="status"></small></form></div><div class="admin-box"><h2>Produk</h2><div id="productList"></div></div><div class="admin-box"><h2>Order & Pembayaran</h2><div id="orders"></div></div></div></div></main><script type="module" src="assets/js/admin.js"></script></body></html>
