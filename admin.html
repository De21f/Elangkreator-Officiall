<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — ELANGKREATOR</title><link rel="stylesheet" href="assets/css/style.css"></head><body><header><nav class="container nav"><a class="brand" href="index.html">🦅 ELANGKREATOR</a><a href="index.html">Website</a></nav></header><main class="section"><div class="container"><div id="loginPanel" class="panel"><p class="eyebrow">ADMIN LOGIN</p><h1>Masuk Dashboard</h1><form id="loginForm" class="form"><input id="email" type="email" placeholder="Email admin" required><input id="password" type="password" placeholder="Password" required><button class="btn">Login</button><small id="loginStatus"></small></form></div><div id="dashboard" hidden><div class="dash-head"><div><p class="eyebrow">DASHBOARD</p><h1>ELANGKREATOR Admin</h1></div><button id="logout" class="btn outline">Logout</button></div><div id="metrics" class="metrics"></div><div class="admin-grid"><section class="panel"><h2>Order Terbaru</h2><div id="orders">Memuat...</div></section><section class="panel"><h2>Tambah Produk</h2><form id="productForm" class="form"><input name="name" placeholder="Nama produk" required><input name="category" placeholder="Kategori" required><input name="price" type="number" min="0" placeholder="Harga (Rp)" required><textarea name="description" placeholder="Deskripsi" required></textarea><button class="btn">Simpan Produk</button><small id="productStatus"></small></form><h3>Produk</h3><div id="productList"></div></section></div></div></div></main><script type="module" src="assets/js/admin.js"></script></body></html>
